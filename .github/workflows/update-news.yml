name: Update News

on:
  schedule:
    - cron: '0 1 * * *'    # 北京时间每日 09:00
    - cron: '0 13 * * *'   # 北京时间每日 21:00
  workflow_dispatch: {}     # 支持手动触发

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch & generate data
        run: python3 scripts/fetch_news.py --days 2

      - name: Commit & push
        run: |
          git config user.name "ai-radar-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No new data, skip push."
          else
            git commit -m "data: update $(TZ=Asia/Shanghai date +%F) news"
            git pull --rebase origin ${GITHUB_REF_NAME:-main}
            git push
          fi
